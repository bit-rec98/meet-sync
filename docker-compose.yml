# Local development database only. Not a production configuration.
# Variable names are shared with the API (see .env.example).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      # The image creates this account with full rights on DB_NAME: it is the migration account.
      MYSQL_USER: ${DB_MIGRATION_USER:?Set DB_MIGRATION_USER in .env}
      MYSQL_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env}
      # Used by docker/mysql-init/10-accounts.sh to create the test database and runtime account.
      DB_TEST_NAME: ${DB_TEST_NAME:?Set DB_TEST_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      # Bound to localhost only. 3307 avoids clashing with a MySQL already installed on 3306.
      - '127.0.0.1:${DB_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
