openapi: 3.1.0
info:
  title: MeetSync API
  version: 0.1.0
  description: |
    REST API of MeetSync. Covers authentication, meetings and invitees, and a health check.

    **Meetings.** All meeting routes need `Authorization: Bearer <token>`. A meeting is visible only to its
    host and invitees: anyone else gets `404`, exactly as for a meeting that does not exist. Only the host
    can edit, cancel or invite (an invitee gets `403`). Times are ISO 8601 in UTC.

    **Authentication model.** `register` and `login` return a short-lived access token (JWT, 15 minutes)
    in the body and set a refresh token in an `HttpOnly` cookie. Send the access token as
    `Authorization: Bearer <token>`. When it expires, call `refresh`, which rotates the refresh cookie.

    **Errors** always use the shape of the `ErrorResponse` schema. Messages are generic and never include
    submitted values.

    **Rate limits** apply to register, login, refresh and inviting (see each operation); exceeded limits
    answer `429` with a `Retry-After` header.
servers:
  - url: /api/v1
    description: Same origin as the web app (Netlify proxies /api to the API host in production).
tags:
  - name: Health
  - name: Authentication
  - name: Meetings
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        '200':
          description: The API process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /auth/register:
    post:
      tags: [Authentication]
      summary: Create an account and start a session
      description: |
        Limited to 5 requests per hour per client address. The email is trimmed and lower-cased by the
        server. Fails with `409` if the email is already registered (this reveals that the email has an
        account; there is no email verification yet).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/SessionStarted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and start a session
      description: |
        Only failed attempts count towards the limits: 10 per 15 minutes per client address and 5 per
        15 minutes per email. Once a limit is reached, further attempts are refused (even with the right
        password) until the window ends. A wrong password and an unknown email produce the same response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_credentials
                  message: Invalid email or password.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Get a new access token and rotate the refresh token
      description: |
        Needs the refresh cookie. The cookie is single-use: the response sets a new one. Presenting a
        cookie that was already used revokes the whole session (all later tokens of that login), because
        it indicates the cookie may have been stolen. A rejected cookie is cleared in the response.
        Limited to 30 requests per 15 minutes per client address. If the request carries an `Origin`
        header, it must be one of the configured web origins.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token; the refresh cookie was rotated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: End the current session
      description: |
        Revokes the session of the refresh cookie (if any) and clears the cookie. Always answers `204`,
        also when the cookie is missing, unknown or already revoked. If the request carries an `Origin`
        header, it must be one of the configured web origins.
      security:
        - refreshCookie: []
        - {}
      responses:
        '204':
          description: Logged out. The refresh cookie is cleared.
          headers:
            Set-Cookie:
              description: Clears the refresh cookie (expired in the past).
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Missing, malformed, invalid or expired access token. The reason is never disclosed.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: Authentication required.
  /meetings:
    post:
      tags: [Meetings]
      summary: Create a meeting
      description: |
        The caller becomes the host. `startsAt` must not be in the past (one minute of clock skew is
        tolerated) and at most one year ahead. Unknown fields (for example `hostId` or `status`) are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequest'
      responses:
        '201':
          description: The meeting was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/BearerUnauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      tags: [Meetings]
      summary: List my meetings
      description: |
        Meetings the user hosts or is invited to. `upcoming` is every scheduled meeting that has not ended
        yet (including one in progress), soonest first. `past` is everything else (ended, cancelled, or
        scheduled but over), most recent first. A meeting is over from its end time on.
      security:
        - bearerAuth: []
      parameters:
        - name: when
          in: query
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: One page of meetings.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/BearerUnauthorized'
  /meetings/{id}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Meetings]
      summary: Get a meeting
      description: |
        The host also sees the email of each invitee; invitees see only display names.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The meeting.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/BearerUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Meetings]
      summary: Edit a meeting
      description: |
        Host only, and only while the meeting is scheduled and has not started (`409` otherwise). Send any
        subset of the fields; `description: null` clears the description. The host and the status cannot be
        changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetingRequest'
      responses:
        '200':
          description: The updated meeting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/BearerUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [Meetings]
      summary: Cancel a meeting
      description: |
        Host only. The meeting is kept and shows as `cancelled` (it appears under `past`). Cancelling an
        already cancelled meeting succeeds; a meeting that has ended or whose time is over answers `409`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The meeting is cancelled.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/BearerUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /meetings/{id}/invitees:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    post:
      tags: [Meetings]
      summary: Invite a registered user
      description: |
        Host only, for a meeting that is scheduled and not over. The user is found by exact email (trimmed,
        case-insensitive). This reveals to the host whether that email has an account. At most 50 invitees
        per meeting. Limited to 30 requests per hour per user (failed attempts count).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInviteeRequest'
      responses:
        '201':
          description: The user was invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitee'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/BearerUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            `not_found`: the meeting is missing or not visible to the caller. `user_not_found`: no registered
            user has this email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: user_not_found
                  message: No registered user has this email.
        '409':
          description: |
            `already_invited`: the user is the host or already invited. `invitee_limit_reached`: the meeting
            has 50 invitees. `invalid_state`: the meeting is cancelled or over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: already_invited
                  message: This user is already part of the meeting.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
  /meetings/{id}/invitees/{userId}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
      - name: userId
        in: path
        required: true
        description: The id of the invited user.
        schema:
          type: string
          format: uuid
    delete:
      tags: [Meetings]
      summary: Remove an invitee
      description: |
        The host can remove any invitee. An invitee can remove only themselves (`403` for anyone else) and
        then loses access to the meeting. Allowed whatever the state of the meeting.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The invitee was removed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/BearerUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    MeetingId:
      name: id
      in: path
      required: true
      description: The id of the meeting.
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by register, login, or refresh. Valid for 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Set by the server (`HttpOnly`, `SameSite=Strict`, `Path=/api/v1/auth`, `Secure` in production,
        valid for 7 days). Browsers send it automatically; scripts cannot read it.
  headers:
    NoStore:
      description: Responses that carry tokens or personal data must not be cached.
      schema:
        type: string
        const: no-store
    SetRefreshCookie:
      description: |
        Sets the refresh cookie: `refresh_token=<opaque token>; Max-Age=604800; Path=/api/v1/auth;
        HttpOnly; SameSite=Strict` (plus `Secure` in production).
      schema:
        type: string
  responses:
    SessionStarted:
      description: Session started. The access token is in the body; the refresh token is in the cookie.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SetRefreshCookie'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            type: object
            required: [user, accessToken]
            properties:
              user:
                $ref: '#/components/schemas/User'
              accessToken:
                type: string
    ValidationError:
      description: |
        The body is missing, is not valid JSON, has unknown fields, or breaks a field rule. `details`
        names each field and the broken rule, never the submitted value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: Invalid request.
              details:
                - path: password
                  code: too_small
    Unauthorized:
      description: Missing, invalid, expired, or already used refresh cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Authentication required.
    BearerUnauthorized:
      description: Missing, malformed, invalid or expired access token. The reason is never disclosed.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Authentication required.
    NotFound:
      description: |
        The meeting does not exist, or the caller is neither its host nor an invitee (the two cases are
        indistinguishable), or the user to remove is not an invitee.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Resource not found.
    Conflict:
      description: |
        `invalid_state`: the meeting is not in a state that allows this (for example it has started, was
        cancelled, or is over).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_state
              message: The meeting is not in a state that allows this action.
    Forbidden:
      description: |
        The request is not allowed. For refresh and logout: its `Origin` is not an allowed web origin. For
        meetings: the caller is an invitee, not the host (or tries to remove another invitee).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: You do not have permission to do this.
    PayloadTooLarge:
      description: The request body is larger than 100 kB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: payload_too_large
              message: Request body is too large.
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unsupported_media_type
              message: Content-Type must be application/json.
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again later.
  schemas:
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased by the server.
          example: ana@example.com
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed by the server; control characters are not allowed.
          example: Ana
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Not trimmed or altered. Any characters are allowed.
          writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: ana@example.com
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - invalid_credentials
                - unauthorized
                - forbidden
                - not_found
                - email_taken
                - user_not_found
                - already_invited
                - invitee_limit_reached
                - invalid_state
                - payload_too_large
                - unsupported_media_type
                - rate_limited
                - internal_error
            message:
              type: string
            details:
              type: array
              description: Only present for `validation_error`.
              items:
                type: object
                required: [path, code]
                properties:
                  path:
                    type: string
                    description: Field name, empty for the whole body.
                  code:
                    type: string
                    description: The rule that failed, for example `too_small` or `invalid_format`.
    CallType:
      type: string
      enum: [audio, video]
    MeetingStatus:
      type: string
      enum: [scheduled, ended, cancelled]
      description: |
        `ended` is reserved for meetings the host ended during a call (not implemented yet). A scheduled
        meeting whose end time has passed is treated as over.
    MeetingHost:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    Invitee:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
          description: Included only when the viewer is the host.
    Meeting:
      type: object
      required:
        [id, title, description, startsAt, durationMinutes, callType, status, role, host, invitees]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        startsAt:
          type: string
          format: date-time
          description: UTC, for example `2026-12-01T15:00:00.000Z`.
        durationMinutes:
          type: integer
        callType:
          $ref: '#/components/schemas/CallType'
        status:
          $ref: '#/components/schemas/MeetingStatus'
        role:
          type: string
          enum: [host, invitee]
          description: The role of the user making the request.
        host:
          $ref: '#/components/schemas/MeetingHost'
        invitees:
          type: array
          items:
            $ref: '#/components/schemas/Invitee'
    MeetingSummary:
      type: object
      description: A meeting in a list. It has the invitee count instead of the invitees.
      required:
        [
          id,
          title,
          description,
          startsAt,
          durationMinutes,
          callType,
          status,
          role,
          host,
          inviteeCount,
        ]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        callType:
          $ref: '#/components/schemas/CallType'
        status:
          $ref: '#/components/schemas/MeetingStatus'
        role:
          type: string
          enum: [host, invitee]
        host:
          $ref: '#/components/schemas/MeetingHost'
        inviteeCount:
          type: integer
          minimum: 0
    MeetingList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeetingSummary'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          description: Number of meetings matching the filter, across all pages.
    CreateMeetingRequest:
      type: object
      additionalProperties: false
      required: [title, startsAt, durationMinutes, callType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed by the server.
          example: Weekly sync
        description:
          type: [string, 'null']
          maxLength: 2000
          description: Trimmed by the server; an empty text is stored as no description.
        startsAt:
          type: string
          format: date-time
          description: |
            ISO 8601 with `Z` or an explicit offset (times without a zone are rejected); stored and returned
            in UTC. Not in the past (one minute of tolerance) and at most one year ahead.
          example: '2026-12-01T15:00:00Z'
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        callType:
          $ref: '#/components/schemas/CallType'
    UpdateMeetingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of the creation fields, with the same rules. At least one field is required.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
          description: '`null` clears the description; leaving the field out keeps it.'
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        callType:
          $ref: '#/components/schemas/CallType'
    AddInviteeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased by the server.
          example: guest@example.com
